name: financial_management
description: 'A new Flutter project.'
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  fl_chart: ^1.2.0
  uuid: ^4.5.3
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  flutter_dotenv: ^6.0.1
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  file_picker: ^8.1.4
  excel: ^4.0.6
  path_provider: ^2.1.5
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: 'lib/assets/app_icon.png'
  min_sdk_android: 21
  adaptive_icon_background: '#0D6E7A'
  adaptive_icon_foreground: 'lib/assets/app_icon.png'
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true
  assets:
    - .env
    - lib/assets/app_icon.png
