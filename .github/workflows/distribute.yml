name: Distribui Android (Firebase App Distribution)

# Dispara ao empurrar uma tag "v*" (ex.: v0.1.1) ou manualmente pela aba Actions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      notes:
        description: 'Notas da release (opcional)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      # O pubspec declara `.env` como asset; ele é gitignored, então precisa ser
      # recriado aqui senão o build falha. Vazio já basta — a config do Firebase
      # entra em runtime pelo CloudConfig. Para builds pré-configurados, defina o
      # secret ENV_FILE com o conteúdo do .env.
      - name: Cria .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s' "$ENV_FILE" > .env

      - name: Dependências
        run: flutter pub get

      - name: Análise
        run: flutter analyze

      - name: Testes
        run: flutter test

      # build-number vem do run_number para o App Distribution não rejeitar
      # versionCode duplicado a cada release.
      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Distribui no Firebase App Distribution
        env:
          # firebase-tools usa FIREBASE_TOKEN do ambiente automaticamente.
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_GROUPS: ${{ vars.FIREBASE_GROUPS }}
          INPUT_NOTES: ${{ github.event.inputs.notes }}
        run: |
          set -uo pipefail
          # tr remove qualquer espaco/quebra-de-linha invisivel no App ID/grupo.
          APP_ID="$(printf '%s' "${FIREBASE_APP_ID}" | tr -d '[:space:]')"
          GROUPS="$(printf '%s' "${FIREBASE_GROUPS:-testers}" | tr -d '[:space:]')"
          NOTES="${INPUT_NOTES:-Build $GITHUB_REF_NAME ($GITHUB_SHA)}"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          # Retry: o :distribute pode dar 404 transitorio logo apos o upload
          # (release ainda propagando). O firebase-tools reaproveita o release
          # pelo hash do APK, entao a re-tentativa nao re-faz upload.
          for attempt in 1 2 3; do
            echo "::group::Distribuicao - tentativa $attempt"
            if npx -y firebase-tools@latest appdistribution:distribute \
                "$APK" --app "$APP_ID" --groups "$GROUPS" --release-notes "$NOTES"; then
              echo "::endgroup::"
              echo "Distribuido com sucesso na tentativa $attempt."
              exit 0
            fi
            echo "::endgroup::"
            echo "Tentativa $attempt falhou; aguardando 20s..."
            sleep 20
          done
          echo "Falhou apos 3 tentativas."
          exit 1
